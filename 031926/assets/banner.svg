<svg width="900" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BC8CFF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="180" fill="url(#bg)" rx="12"/>
  <!-- grid dots -->
  <g fill="#21262D" opacity="0.6">
    <circle cx="30" cy="30" r="1.5"/><circle cx="70" cy="30" r="1.5"/><circle cx="110" cy="30" r="1.5"/><circle cx="150" cy="30" r="1.5"/><circle cx="190" cy="30" r="1.5"/><circle cx="230" cy="30" r="1.5"/><circle cx="270" cy="30" r="1.5"/><circle cx="310" cy="30" r="1.5"/><circle cx="350" cy="30" r="1.5"/><circle cx="390" cy="30" r="1.5"/><circle cx="430" cy="30" r="1.5"/><circle cx="470" cy="30" r="1.5"/><circle cx="510" cy="30" r="1.5"/><circle cx="550" cy="30" r="1.5"/><circle cx="590" cy="30" r="1.5"/><circle cx="630" cy="30" r="1.5"/><circle cx="670" cy="30" r="1.5"/><circle cx="710" cy="30" r="1.5"/><circle cx="750" cy="30" r="1.5"/><circle cx="790" cy="30" r="1.5"/><circle cx="830" cy="30" r="1.5"/><circle cx="870" cy="30" r="1.5"/>
    <circle cx="30" cy="60" r="1.5"/><circle cx="70" cy="60" r="1.5"/><circle cx="110" cy="60" r="1.5"/><circle cx="150" cy="60" r="1.5"/><circle cx="190" cy="60" r="1.5"/><circle cx="230" cy="60" r="1.5"/><circle cx="270" cy="60" r="1.5"/><circle cx="310" cy="60" r="1.5"/><circle cx="350" cy="60" r="1.5"/><circle cx="390" cy="60" r="1.5"/><circle cx="430" cy="60" r="1.5"/><circle cx="470" cy="60" r="1.5"/><circle cx="510" cy="60" r="1.5"/><circle cx="550" cy="60" r="1.5"/><circle cx="590" cy="60" r="1.5"/><circle cx="630" cy="60" r="1.5"/><circle cx="670" cy="60" r="1.5"/><circle cx="710" cy="60" r="1.5"/><circle cx="750" cy="60" r="1.5"/><circle cx="790" cy="60" r="1.5"/><circle cx="830" cy="60" r="1.5"/><circle cx="870" cy="60" r="1.5"/>
    <circle cx="30" cy="150" r="1.5"/><circle cx="70" cy="150" r="1.5"/><circle cx="110" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/><circle cx="190" cy="150" r="1.5"/><circle cx="230" cy="150" r="1.5"/><circle cx="270" cy="150" r="1.5"/><circle cx="310" cy="150" r="1.5"/><circle cx="350" cy="150" r="1.5"/><circle cx="390" cy="150" r="1.5"/><circle cx="430" cy="150" r="1.5"/><circle cx="470" cy="150" r="1.5"/><circle cx="510" cy="150" r="1.5"/><circle cx="550" cy="150" r="1.5"/><circle cx="590" cy="150" r="1.5"/><circle cx="630" cy="150" r="1.5"/><circle cx="670" cy="150" r="1.5"/><circle cx="710" cy="150" r="1.5"/><circle cx="750" cy="150" r="1.5"/><circle cx="790" cy="150" r="1.5"/><circle cx="830" cy="150" r="1.5"/><circle cx="870" cy="150" r="1.5"/>
  </g>
  <!-- accent line -->
  <rect x="0" y="175" width="900" height="5" fill="url(#accent)" rx="2"/>
  <!-- node icon -->
  <g transform="translate(320, 55)" filter="url(#glow)">
    <circle cx="0" cy="0" r="6" fill="#58A6FF"/>
    <circle cx="40" cy="-20" r="4" fill="#BC8CFF"/>
    <circle cx="45" cy="25" r="5" fill="#58A6FF"/>
    <circle cx="-35" cy="15" r="4" fill="#BC8CFF"/>
    <line x1="0" y1="0" x2="40" y2="-20" stroke="#58A6FF" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="0" x2="45" y2="25" stroke="#BC8CFF" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="0" x2="-35" y2="15" stroke="#58A6FF" stroke-width="1" opacity="0.4"/>
    <line x1="40" y1="-20" x2="45" y2="25" stroke="#BC8CFF" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- title -->
  <text x="450" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700"
